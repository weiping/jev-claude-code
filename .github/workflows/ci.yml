name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0  # v4+: immutable releases, no floating major tag
        with:
          args: check .
      - name: shellcheck
        run: shellcheck plugins/jev/scripts/*.sh tests/*.sh

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # setup.sh requires 3.10+
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: plugins/jev/requirements.txt
      - run: pip install -r plugins/jev/requirements.txt
      - run: python tests/test_hooks.py

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate manifests, skills and agents
        run: claude plugin validate .
      - name: End-to-end test against a fake Messages API
        run: bash tests/e2e.sh
